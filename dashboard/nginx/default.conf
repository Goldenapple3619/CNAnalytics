map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $arg_v $client_cache_control {
    default        "no-cache";
    "~^[0-9a-f]{8,}$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://processor:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control $client_cache_control always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
