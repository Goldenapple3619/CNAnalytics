[package]
name = "ingestion_api"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.36.0", features = ["bundled"] }
# Pinned to 1.x: queue-file 2.0.0 corrupts the file once it has grown past its
# initial size and is then drained (clear() truncates it without fixing the header,
# so the next open fails with "v2 file is truncated").
queue-file = "1"
zstd = "0.14"
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.12"