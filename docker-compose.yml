name: analytics

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

networks:
  edge:
  backend:
    internal: true
  analytics:
    name: analytics

volumes:
  data:

services:
  init-data:
    image: debian:bookworm-slim
    user: "0:0"
    command: >
      sh -c "
        mkdir -p /mnt/data/raw /mnt/data/processed &&
        chown -R 10001:10001 /mnt/data
      "
    volumes:
      - data:/mnt/data
    restart: "no"

  processor:
    build: ./processor
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, backend]
    stop_grace_period: 15s
    volumes:
      - data:/mnt/data
    environment:
      INGEST_DB: "/mnt/data/raw/db.sqlite"
      PROCESSED_DB: "/mnt/data/processed/db.sqlite"
    depends_on:
      init-data:
        condition: service_completed_successfully
    logging: *logging

  ingestion:
    build:
      context: ./ingestion
      additional_contexts:
        proto: ./proto
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs: [/tmp]
    networks:
      backend:
      analytics:
        aliases:
          - analytics
    stop_grace_period: 15s
    volumes:
      - data:/mnt/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      ANALYTICS_QUEUE_PATH: "/mnt/data/raw/queue.dat"
      ANALYTICS_DB_PATH: "/mnt/data/raw/db.sqlite"
    logging: *logging

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    <<: *hardening
    networks: [edge]
    depends_on:
      processor: { condition: service_healthy }
    logging: *logging
